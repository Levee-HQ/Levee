[package]
name = "levee-policy"
description = "Cover position lifecycle — quote, buy, settle, and expire policies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
levee-shared = { path = "../shared" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
levee-registry = { path = "../levee-registry" }
levee-pool = { path = "../levee-pool" }
