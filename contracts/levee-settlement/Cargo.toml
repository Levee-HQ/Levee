[package]
name = "levee-settlement"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
levee-shared = { path = "../shared" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
levee-registry = { path = "../levee-registry" }
levee-pool = { path = "../levee-pool" }
levee-policy = { path = "../levee-policy" }
levee-oracle = { path = "../levee-oracle" }
